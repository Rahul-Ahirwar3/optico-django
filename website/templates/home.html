
{% extends 'base.html' %}

{% block title %}
Home - Optico
{% endblock %}

{% block content %}

<div class="row align-items-center py-5">

    <!-- Left Side - Content -->
    <div class="col-md-6">

        <h1 class="display-4 fw-bold">
            Brighten Your World With
            <span style="color:#ff9800;">
                LED Lights
            </span>
        </h1>

        <p class="lead mt-4">
            Discover energy-efficient, stylish and powerful
            LED lighting solutions for your home and business.
        </p>

        <a href="{% url 'products' %}"
           class="btn btn-warning btn-lg mt-3">
            Explore Products
        </a>

    </div>


    <!-- Right Side - Image -->
    <div class="col-md-6 text-center">

        <img
            src="https://images.unsplash.com/photo-1565814329452-e1efa11c5b89?auto=format&fit=crop&w=800&q=80"
            class="img-fluid rounded shadow"
            alt="LED Lights"
            style="width:100%; height:400px; object-fit:cover;">

    </div>

</div>

{% endblock %}

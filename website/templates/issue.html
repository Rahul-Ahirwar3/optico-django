<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bulb Issue & Stock</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: #ff9800;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .stock-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stock-card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .stock-number {
            font-size: 40px;
            font-weight: bold;
            color: #ff9800;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff9800;
        }

        .amount-box {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .amount-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 17px;
        }

        .total {
            font-weight: bold;
            font-size: 20px;
        }

        .due {
            color: #e53935;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e68900;
        }

        .error {
            background: #ffe5e5;
            color: #d32f2f;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <h2>OPTICO</h2>

    <div>

        <a href="/">Home</a>

        <a href="/products/">Products</a>

        <a href="/issue/">Issue & Stock</a>

        <a href="/admin/">Admin</a>

    </div>

</div>


<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">


    <!-- =========================
         STOCK
    ========================= -->

    <div class="stock-card">

        <h3>Total Available Stock</h3>

        <div class="stock-number">
            {{ total_stock }}
        </div>

        <p>
            Total bulbs currently available
        </p>

    </div>


    <!-- =========================
         ERROR MESSAGE
    ========================= -->

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <!-- =========================
         ISSUE FORM
    ========================= -->

    <div class="form-card">

        <h2>Issue Bulb</h2>


        <form method="POST">

            {% csrf_token %}


            <!-- Product + Customer -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Select Bulb
                    </label>

                    <select
                        name="product"
                        id="product"
                        required
                    >

                        <option value="">
                            Select Bulb
                        </option>

                        {% for product in products %}

                            <option
                                value="{{ product.id }}"
                                data-price="{{ product.price }}"
                                data-stock="{{ product.stock_quantity }}"
                            >

                                {{ product.name }}
                                -
                                Stock: {{ product.stock_quantity }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Customer Name
                    </label>

                    <input
                        type="text"
                        name="customer_name"
                        placeholder="Enter customer name"
                        required
                    >

                </div>

            </div>


            <!-- Quantity + Date -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Issue Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        id="quantity"
                        min="1"
                        placeholder="Enter quantity"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Issue Date
                    </label>

                    <input
                        type="date"
                        name="issue_date"
                        required
                    >

                </div>

            </div>


            <!-- Rate + Payment -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Rate per Bulb
                    </label>

                    <input
                        type="number"
                        name="rate"
                        id="rate"
                        step="0.01"
                        min="0"
                        placeholder="Enter rate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Paid Amount
                    </label>

                    <input
                        type="number"
                        name="paid_amount"
                        id="paid_amount"
                        step="0.01"
                        min="0"
                        value="0"
                        placeholder="Enter paid amount"
                    >

                </div>

            </div>


            <!-- =========================
                 AMOUNT SUMMARY
            ========================= -->

            <div class="amount-box">

                <div class="amount-row">

                    <span>
                        Total Amount
                    </span>

                    <span id="total">
                        ₹0.00
                    </span>

                </div>


                <div class="amount-row">

                    <span>
                        Paid Amount
                    </span>

                    <span id="paid">
                        ₹0.00
                    </span>

                </div>


                <div class="amount-row due">

                    <span>
                        Due Amount
                    </span>

                    <span id="due">
                        ₹0.00
                    </span>

                </div>

            </div>


            <button type="submit">

                Issue Bulb & Save Record

            </button>


        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    const product = document.getElementById("product");

    const quantity = document.getElementById("quantity");

    const rate = document.getElementById("rate");

    const paid = document.getElementById("paid_amount");

    const total = document.getElementById("total");

    const paidDisplay = document.getElementById("paid");

    const due = document.getElementById("due");


    function calculateAmount() {

        let qty = Number(quantity.value) || 0;

        let price = Number(rate.value) || 0;

        let paidAmount = Number(paid.value) || 0;

        let totalAmount = qty * price;

        let dueAmount = totalAmount - paidAmount;


        if (dueAmount < 0) {

            dueAmount = 0;

        }


        total.innerText =
            "₹" + totalAmount.toFixed(2);

        paidDisplay.innerText =
            "₹" + paidAmount.toFixed(2);

        due.innerText =
            "₹" + dueAmount.toFixed(2);

    }


    product.addEventListener(
        "change",
        function () {

            const selected =
                product.options[
                    product.selectedIndex
                ];

            const price =
                selected.getAttribute(
                    "data-price"
                );


            if (price) {

                rate.value = price;

            }


            calculateAmount();

        }
    );


    quantity.addEventListener(
        "input",
        calculateAmount
    );


    rate.addEventListener(
        "input",
        calculateAmount
    );


    paid.addEventListener(
        "input",
        calculateAmount
    );

</script>


</body>

</html>

{% extends 'base.html' %}

{% block title %}
Products - Optico
{% endblock %}

{% block content %}

<style>
    .product-card {
        height: 100%;
        min-height: 450px;
        border: none;
        border-radius: 10px;
        overflow: hidden;
    }

    .product-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .product-card .card-body {
        display: flex;
        flex-direction: column;
    }

    .product-card .btn {
        margin-top: auto;
        width: fit-content;
    }
</style>

<div class="container py-5">


<h2 class="text-center mb-5">
    Our <span style="color:#ff9800;">Products</span>
</h2>

<div class="row g-4">

    {% for product in products %}

    <div class="col-md-4">

        <div class="card shadow product-card">

            {% if product.image %}
                <img src="{{ product.image.url }}"
                     class="card-img-top"
                     alt="{{ product.name }}">
            {% endif %}

            <div class="card-body">

                <h4>{{ product.name }}</h4>

                <p>
                    {{ product.description }}
                </p>

                <button class="btn btn-warning">
                    Product Details
                </button>

            </div>

        </div>

    </div>

    {% empty %}

    <div class="col-12 text-center">
        <h4>No products available.</h4>
    </div>

    {% endfor %}

</div>


</div>

{% endblock %}

```html
{% extends 'base.html' %}

{% block title %}
Contact - Optico
{% endblock %}

{% block content %}

<div class="container py-5">

    <h2 class="text-center mb-5">
        Contact <span style="color:#ff9800;">Us</span>
    </h2>

    <div class="row g-4">

        <!-- Google Map - LEFT SIDE -->
        <div class="col-md-6">

            <div class="card shadow h-100">

                <div class="card-body p-0">

                    <iframe
                        src="https://www.google.com/maps?q=Optico+Solutions+Pvt+Ltd,+B-38A,+IT+Park,+Badwai,+Bhopal,+Madhya+Pradesh&output=embed"
                        width="100%"
                        height="100%"
                        style="border:0; min-height:450px;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                </div>

            </div>

        </div>


        <!-- Contact Form - RIGHT SIDE -->
        <div class="col-md-6">

            <div class="card shadow p-4 h-100">

                <h4 class="mb-4">
                    Get In Touch
                </h4>

                <form method="POST">

                    {% csrf_token %}

                    <!-- Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Phone -->
                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                            required>

                    </div>


                    <!-- Message -->
                    <div class="mb-3">

                        <label class="form-label">
                            Message
                        </label>

                        <textarea
                            name="message"
                            class="form-control"
                            rows="5"
                            placeholder="Enter your message"
                            required></textarea>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-warning w-100">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
